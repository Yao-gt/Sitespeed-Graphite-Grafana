name: sitespeedio-graphite-grafana

version: '3'

services:

    grafana:
      image: grafana/grafana:12.2.0
      hostname: grafana
      depends_on:
        - graphite
      links:
        - graphite
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_PASSWORD=admin
        - GF_SECURITY_ADMIN_USER=admin
        - GF_AUTH_ANONYMOUS_ENABLED=true
        - GF_USERS_ALLOW_SIGN_UP=false
        - GF_USERS_ALLOW_ORG_CREATE=false
        - GF_INSTALL_PLUGINS=marcusolsson-json-datasource,marcusolsson-dynamictext-panel
        - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/Welcome.json
      volumes:
        - grafana-data:/var/lib/grafana
        - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
        - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
        - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
      restart: always
      networks:
        - sitespeed-graphite-grafana_default
    
    graphite:
      image: sitespeedio/graphite:1.1.10-3
      hostname: graphite
      ports:
        - "2003:2003"
        - "8080:80"
      restart: always
      volumes:
        - whisper-data:/opt/graphite/storage/whisper
        - ./graphite/graphite.db:/opt/graphite/storage/graphite.db
        - ./graphite/conf/storage-schemas.conf:/opt/graphite/conf/storage-schemas.conf
        - ./graphite/conf/storage-aggregation.conf:/opt/graphite/conf/storage-aggregation.conf
        - ./graphite/conf/carbon.conf:/opt/graphite/conf/carbon.conf
      networks:
        - sitespeed-graphite-grafana_default
      
    results-server:
      image: nginx:alpine
      container_name: sitespeed-results
      volumes:
        - ./sitespeed-result:/usr/share/nginx/html:ro
      ports:
        - "8888:80"
      networks:
      - sitespeed-graphite-grafana_default

volumes:
    grafana-data:
    whisper-data:


networks:
  sitespeed-graphite-grafana_default:
    name: sitespeed-graphite-grafana_network